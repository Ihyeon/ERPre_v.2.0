name: CI/CD

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Node.js 20.17.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Node Dependencies
        run: npm install

      - name: Build React App (Webpack)
        run: npm run build

      - name: "Debug: Check Webpack Output"
        run: ls -R ./build/static/

      - name: Build Backend
        run: ./gradlew clean build -x test

      - name: "Debug: Print Current Directory"
        run: pwd

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker Backend Build & Push
      - name: Docker Backend Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/erpre:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: "ubuntu"
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d "~/erpre/.git" ]; then
              rm -rf ~/erpre  
              git clone https://github.com/Ihyeon/ERPre_v.2.0.git ~/erpre
            fi
            
            cd ~/erpre
            
            git reset --hard
            git pull origin develop
            
            echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env
            echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
            
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/erpre:latest
            sudo docker-compose up -d
            sudo docker image prune -f

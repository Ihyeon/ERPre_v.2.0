name: CI/CD

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Backend
        run: ./gradlew clean build -x test

      # 🔥 Docker Hub 로그인 단계 추가 (이걸 반드시 추가!)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker Backend Build & Push (username/password는 삭제!)
      - name: Docker Backend Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-springboot-app:latest

      # Docker Frontend Build & Push (username/password는 삭제!)
      - name: Docker Frontend Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-react-app:latest

name: CI/CD

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Node.js 20.17.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Node Dependencies
        run: npm ci

      - name: Build React App (Webpack)
        run: npm run build

      - name: Build Backend
        run: ./gradlew clean build -x test

      - name: Check JAR File
        run: |
          if [ -f "build/libs/erpre-0.0.1-SNAPSHOT.jar" ]; then
            echo "JAR 파일이 존재합니다."
          else
            echo "JAR 파일이 존재하지 않습니다."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/erpre:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: "ubuntu"
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 디렉토리 없으면 새로 생성, 있으면 업데이트
            if [ ! -d "~/erpre" ]; then
              mkdir -p ~/erpre
              cd ~/erpre
              git init
              git remote add origin https://github.com/Ihyeon/ERPre_v.2.0.git
            fi
            
            cd ~/erpre
            git fetch origin
            git reset --hard origin/develop

            # .env 파일 생성
            echo "DATABASE_URL=\"${{ secrets.DATABASE_URL }}\"" > .env
            echo "DATABASE_USERNAME=\"${{ secrets.DATABASE_USERNAME }}\"" >> .env
            echo "DATABASE_PASSWORD=\"${{ secrets.DATABASE_PASSWORD }}\"" >> .env
            echo "CORS_ALLOWED_ORIGINS=\"${{ secrets.CORS_ALLOWED_ORIGINS }}\"" >> .env
            echo "DOCKER_USERNAME=\"${{ secrets.DOCKER_USERNAME }}\"" >> .env
            echo "COOKIE_DOMAIN=\"${{ secrets.COOKIE_DOMAIN }}\"" >> .env

            # Docker 이미지 풀 및 배포
            sudo docker-compose down  # 기존 컨테이너 종료 (옵션)
            sudo docker-compose pull  # 항상 최신 이미지 가져오기
            sudo docker-compose up -d  # 최신 이미지로 컨테이너 실행
            sudo docker image prune -f  # 사용하지 않는 이미지 삭제
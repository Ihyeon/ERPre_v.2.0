services:
  backend:
    container_name: erpre-backend
    image: "${DOCKER_USERNAME}/erpre:latest"
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
    restart: always

